# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  buildLinux:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          sudo apt-get install libvlc-dev
          sudo apt-get install libvlccore-dev
          haxelib setup ~/haxelib
          haxelib selfupdate || true
          haxelib install hxcpp 4.3.2 > /dev/null
          haxelib install flixel 5.2.2
          haxelib install lime 8.0.2
          haxelib install openfl 9.2.1
          haxelib --always run lime setup flixel
          haxelib --always run lime setup
          haxelib install flixel-tools
          haxelib --always run flixel-tools setup
          haxelib install flixel-ui 2.5.0
          haxelib install flixel-addons 3.0.2
          haxelib set hxcpp 4.3.2
          haxelib set flixel 5.2.2
          haxelib set flixel-ui 2.5.0
          haxelib set lime 8.0.2
          haxelib set openfl 9.2.1
          haxelib set flixel-addons 3.0.2
          haxelib install tjson
          haxelib install hxjsonast
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit
          haxelib install hscript
          haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib install hxcpp-debug-server
          haxelib list
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        run: haxelib run lime build Project.xml linux -release --app-version="4.0.0-${{ github.run_id}}"
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBuild
          path: 'export/release/linux/bin'
  buildWindows:
    runs-on: windows-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          haxelib setup C:/haxelib
          haxelib selfupdate || true
          haxelib install hxcpp 4.3.2 > nul
          haxelib install flixel 5.2.2
          haxelib install lime 8.0.2
          haxelib install openfl 9.2.1
          haxelib --always run lime setup flixel
          haxelib --always run lime setup
          haxelib install flixel-tools
          haxelib --always run flixel-tools setup
          haxelib install flixel-ui 2.5.0
          haxelib install flixel-addons 3.0.2
          haxelib set hxcpp 4.3.2
          haxelib set flixel 5.2.2
          haxelib set flixel-ui 2.5.0
          haxelib set lime 8.0.2
          haxelib set openfl 9.2.1
          haxelib set flixel-addons 3.0.2
          haxelib install tjson
          haxelib install hxjsonast
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit
          haxelib install hscript
          haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib install hxcpp-debug-server
          haxelib list
        shell: cmd
      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        run: haxelib run lime build windows -release --app-version="4.0.0-${{ github.run_id}}"
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: export/release/windows/bin
  buildMac:
    runs-on: macos-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib selfupdate || true
          haxelib install hxcpp 4.3.2 > /dev/null
          haxelib install flixel 5.2.2
          haxelib install lime 8.0.2
          haxelib install openfl 9.2.1
          haxelib --always run lime setup flixel
          haxelib --always run lime setup
          haxelib install flixel-tools
          haxelib --always run flixel-tools setup
          haxelib install flixel-ui 2.5.0
          haxelib install flixel-addons 3.0.2
          haxelib set hxcpp 4.3.2
          haxelib set flixel 5.2.2
          haxelib set flixel-ui 2.5.0
          haxelib set flixel-addons 3.0.2
          haxelib set lime 8.0.2
          haxelib set openfl 9.2.1
          haxelib install tjson
          haxelib install hxjsonast
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit
          haxelib install hscript
          haxelib git hscript-ex https://github.com/ianharrigan/hscript-ex
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib install hxcpp-debug-server
          haxelib list

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION
      - name: Compile
        run: haxelib run lime build mac --app-version="4.0.0-${{ github.run_id}}"
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macBuild
          path: export/release/macos/bin